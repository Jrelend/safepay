# SafePay Beta — production-like stack, used locally and (later) on a VPS.
#   cp .env.example .env && docker compose up --build
# For hot-reload development add the dev override:
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
#
# Only the web and api ports are published, and only on BIND_ADDRESS
# (127.0.0.1 by default). On a VPS put a TLS-terminating reverse proxy in front.
#
# Database roles (created on a fresh volume by infra/postgres/initdb):
#   POSTGRES_USER     superuser, bootstrap only; nothing in this stack uses it.
#   safepay_migrator  owns the schema; used only by the one-shot `migrate` job.
#   safepay_app       least-privileged runtime role used by `api`.
# The init script runs ONLY on an empty volume. After upgrading from Phase 0,
# recreate the volume (`docker compose down -v`); see docs/SECURITY.md.
name: safepay

x-api-common: &api-common
  APP_ENV: ${APP_ENV:-local}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-["http://localhost:3000"]}
  PAYMENTS_SIMULATION_ONLY: "true"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-safepay}
      SAFEPAY_MIGRATOR_PASSWORD: ${SAFEPAY_MIGRATOR_PASSWORD:?set SAFEPAY_MIGRATOR_PASSWORD in .env}
      SAFEPAY_APP_PASSWORD: ${SAFEPAY_APP_PASSWORD:?set SAFEPAY_APP_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/bootstrap-roles.sql:/safepay/bootstrap-roles.sql:ro
    healthcheck:
      # TCP on purpose: during first-run initialisation (role bootstrap) the
      # server listens only on its Unix socket, so this stays unhealthy until done.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  migrate:
    build: ./apps/api
    image: safepay-api:local
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *api-common
      MIGRATION_DATABASE_URL: postgresql+psycopg://safepay_migrator:${SAFEPAY_MIGRATOR_PASSWORD:?set SAFEPAY_MIGRATOR_PASSWORD in .env}@db:5432/${POSTGRES_DB:-safepay}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  api:
    image: safepay-api:local
    restart: unless-stopped
    environment:
      <<: *api-common
      DATABASE_URL: postgresql+psycopg://safepay_app:${SAFEPAY_APP_PASSWORD:?set SAFEPAY_APP_PASSWORD in .env}@db:5432/${POSTGRES_DB:-safepay}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    networks: [backend, frontend]

  web:
    build: ./apps/web
    image: safepay-web:local
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    networks: [frontend]

volumes:
  pgdata:

networks:
  backend:
  frontend:
