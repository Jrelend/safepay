# Development override: hot reload for api and web, database exposed on localhost.
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
services:
  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./apps/api/app:/app/app:ro
      - ./apps/api/migrations:/app/migrations:ro

  admin-api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./apps/api/app:/app/app:ro

  web:
    build:
      context: ./apps/web
      target: deps
    image: safepay-web:dev
    working_dir: /app
    command: ["npx", "next", "dev", "--hostname", "0.0.0.0"]
    environment:
      API_INTERNAL_URL: http://api:8000
      ADMIN_API_INTERNAL_URL: http://admin-api:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
